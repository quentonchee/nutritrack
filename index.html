<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NutriTrack</title>
  <meta name="description" content="Calcule ton quota de calories et suis tes repas au quotidien." />
  <meta name="theme-color" content="#0b1210" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NutriTrack" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main id="app">
    <section id="view-today" class="view" data-view="today"></section>
    <section id="view-calendar" class="view" data-view="calendar" hidden></section>
    <section id="view-weight" class="view" data-view="weight" hidden></section>
    <section id="view-profile" class="view" data-view="profile" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Navigation">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button class="tab" data-tab="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendrier</span>
    </button>
    <button class="tab" data-tab="weight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 3 7-8"/><path d="M15 7h5v5"/></svg>
      <span>Poids</span>
    </button>
    <button class="tab" data-tab="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.8 4.2-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
